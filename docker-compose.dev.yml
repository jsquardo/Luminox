version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: myapp/web:dev
    user: "${UID}:${GID}"
    command: bash -lc "rm -f tmp/pids/server.pid .overmind.sock && bin/setup && bin/dev"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000" # Rails server
      - "3036:3036" # Vite/React dev server (adjust if your port differs)
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:password@db:5432/myapp_development
      # Add others if needed:
      # NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  pgdata:
  bundle_cache:
